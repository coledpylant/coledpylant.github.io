<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Steam Game Recommender</title><desc id="desc">Four recommendation methods compared across Steam review text.</desc>
<rect width="1200" height="675" fill="#eef3f8"/>
<rect x="62" y="60" width="1076" height="555" rx="28" fill="#ffffff" stroke="#d7e0ea" stroke-width="3"/>
<text x="105" y="135" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#17324d">Steam Game Recommender</text>
<text x="105" y="175" font-family="Arial, sans-serif" font-size="22" fill="#5b6b7a">Comparing lexical, semantic, domain-specific, and intent-aware recommendation methods</text>
<g font-family="Arial, sans-serif">
  <rect x="105" y="230" width="215" height="115" rx="16" fill="#e7eef6"/><text x="135" y="272" font-size="22" font-weight="700" fill="#17324d">1 · Bag-of-Words</text><text x="135" y="306" font-size="17" fill="#536273">Cosine similarity</text><text x="135" y="331" font-size="17" fill="#536273">+ VADER sentiment</text>
  <rect x="345" y="230" width="215" height="115" rx="16" fill="#e7eef6"/><text x="375" y="272" font-size="22" font-weight="700" fill="#17324d">2 · Pretrained</text><text x="375" y="306" font-size="17" fill="#536273">Semantic vectors</text><text x="375" y="331" font-size="17" fill="#536273">+ sentiment</text>
  <rect x="585" y="230" width="215" height="115" rx="16" fill="#e7eef6"/><text x="615" y="272" font-size="22" font-weight="700" fill="#17324d">3 · Custom</text><text x="615" y="306" font-size="17" fill="#536273">Steam Word2Vec</text><text x="615" y="331" font-size="17" fill="#536273">100-d embeddings</text>
  <rect x="825" y="230" width="215" height="115" rx="16" fill="#17324d"/><text x="855" y="272" font-size="22" font-weight="700" fill="#ffffff">4 · Intent-aware</text><text x="855" y="306" font-size="17" fill="#dfe8f1">LLM interpretation</text><text x="855" y="331" font-size="17" fill="#dfe8f1">+ deterministic scoring</text>
  <text x="105" y="420" font-size="18" font-weight="700" fill="#8291a0">FINAL INTENT-AWARE TOP 3</text>
  <text x="105" y="478" font-size="31" font-weight="700" fill="#17324d">Hollow Knight</text>
  <text x="105" y="525" font-size="31" font-weight="700" fill="#17324d">Divinity: Original Sin 2</text>
  <text x="105" y="572" font-size="31" font-weight="700" fill="#17324d">Portal 2</text>
  <text x="745" y="450" font-size="18" fill="#536273">Key lesson</text>
  <text x="745" y="486" font-size="23" font-weight="700" fill="#17324d">Intent matters.</text>
  <text x="745" y="522" font-size="18" fill="#536273">“Avoid grind” cannot be treated</text>
  <text x="745" y="549" font-size="18" fill="#536273">as simply another similarity term.</text>
</g>
</svg>
